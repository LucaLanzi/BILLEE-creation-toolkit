schema_version = "1.0.0"

id = "rover_arm_builder"
version = "0.2.0"
name = "Rover & Arm Builder"
tagline = "Author rovers and arms and export ROS 2 robot descriptions"
maintainer = "Rover & Arm Builder contributors"
type = "add-on"
tags = ["Modeling", "Import-Export", "Rigging"]
blender_version_min = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["linux-x64", "windows-x64", "windows-arm64", "macos-arm64"]

[permissions]
files = "Write robot description packages to a folder you choose"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".*"]
